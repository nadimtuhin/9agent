name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # `npm run check` is the same gate contributors run locally: typecheck, build,
  # lint, unit tests. Keeping CI to that one command means the two can't drift.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # The tarball is what users actually install, and `files` governs it -- a
  # missing entry only shows up here, never in the unit tests.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack
      - run: pnpm run build && node dist/index.js --version
