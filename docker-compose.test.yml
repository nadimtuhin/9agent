services:
  mock-router:
    image: node:20-alpine
    command: node test/mock-router.cjs
    volumes: [.:/app]
    working_dir: /app
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:20128/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 1s
      retries: 5
  test-claude:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent claude --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-pi:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent pi --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  # a mismatched --gateway must warn even under --print-only
  test-hermes:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent hermes --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  # --sandbox --print-only must resolve the image tag and compose the docker argv
  # without needing a daemon (there is none in here, by design — see the harness).
  test-sandbox-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent claude --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox --print-only
  # --sandbox must be refused, not silently ignored, for agents that cannot honour it
  test-sandbox-refused:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent pi --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox
  # no --model on a non-TTY: must fail fast with a readable message, not hang
  test-no-tty:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent claude --gateway http://mock-router:20128/v1 --yes safe
  # actually reaches runHost: a stub agent that exits 7 must make 9agent exit 7
  test-exit-code:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    entrypoint: ["sh", "-c"]
    command:
      - >
        printf '#!/bin/sh\nexit 7\n' > /usr/local/bin/claude &&
        chmod +x /usr/local/bin/claude &&
        node dist/index.js --agent claude --model mock/claude-sonnet-4-6
        --gateway http://mock-router:20128/v1 --yes safe;
        c=$$?;
        echo "9agent exited $$c";
        [ "$$c" = "7" ]
