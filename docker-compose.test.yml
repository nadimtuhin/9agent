services:
  mock-router:
    image: node:20-alpine
    command: node test/mock-router.cjs
    volumes: [.:/app]
    working_dir: /app
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:20128/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 1s
      retries: 5
  test-claude:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent claude --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-pi:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent pi --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  # a mismatched --gateway must warn even under --print-only
  test-hermes:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent hermes --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  # --sandbox --print-only must resolve the image tag and compose the docker argv
  # without needing a daemon (there is none in here, by design — see the harness).
  test-sandbox-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent claude --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox --print-only
  test-command-code-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent command-code --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-command-code-sandbox:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent command-code --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox --print-only
  # a missing sandbox prerequisite must be an error, never a silent unsandboxed run
  test-sandbox-no-checkout:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent hermes --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox
  # no --model on a non-TTY: must fail fast with a readable message, not hang
  test-no-tty:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent claude --gateway http://mock-router:20128/v1 --yes safe
  # --- adapter --print-only (loop in harness) ---
  test-aider-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent aider --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-cline-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent cline --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-codex-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent codex --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-jcode-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent jcode --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-kilocode-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent kilocode --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-opencode-print:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent opencode --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  # alias resolution: -a c must resolve to claude
  test-alias-c:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent c --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  # --- sandbox --print-only (standalone in harness) ---
  test-aider-sandbox:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent aider --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox --print-only
  test-cline-sandbox:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent cline --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox --print-only
  test-opencode-sandbox:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent opencode --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox --print-only
  test-kilocode-sandbox:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent kilocode --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox --print-only
  # --- sandbox refusal (standalone, expect failure) ---
  test-codex-sandbox-refuse:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent codex --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox
  test-jcode-sandbox-refuse:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent jcode --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --sandbox
  # --- CLI validation errors (standalone, expect failure) ---
  test-unknown-agent:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent foo --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes safe --print-only
  test-yolo-yes-conflict:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent claude --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yolo --yes safe --print-only
  test-invalid-yes:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    command: --agent claude --model mock/claude-sonnet-4-6 --gateway http://mock-router:20128/v1 --yes maybe --print-only
  test-no-tty-no-agent:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    entrypoint: ["sh", "-c"]
    command:
      - >
        printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/claude &&
        chmod +x /usr/local/bin/claude &&
        node dist/index.js --model mock/claude-sonnet-4-6
        --gateway http://mock-router:20128/v1 --yes safe --print-only
  # --- existing tests ---
  # actually reaches runHost: a stub agent that exits 7 must make 9agent exit 7
  test-exit-code:
    build: .
    depends_on: { mock-router: { condition: service_healthy } }
    entrypoint: ["sh", "-c"]
    command:
      - >
        printf '#!/bin/sh\nexit 7\n' > /usr/local/bin/claude &&
        chmod +x /usr/local/bin/claude &&
        node dist/index.js --agent claude --model mock/claude-sonnet-4-6
        --gateway http://mock-router:20128/v1 --yes safe;
        c=$$?;
        echo "9agent exited $$c";
        [ "$$c" = "7" ]
